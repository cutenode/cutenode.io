name: CI

# Pull requests, and every push to main, which Railway waits on before it deploys (checkSuites in .railway/railway.ts).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commits. Builds here run without GITHUB_TOKEN, so they use the star counts in the content
# files and never depend on GitHub's API.
jobs:
  checks:
    name: Format, lint, types, tests with coverage, Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Component and story tests run in Chromium: every story four times (light, dark, phone, reduced motion), each
      # with axe. pnpm lint above also fails on a component or page without a story.
      - run: pnpm test:coverage
      - run: pnpm build-storybook

  browser:
    name: E2E and Lighthouse on the Caddy server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Both serve build/ through the Caddyfile in Docker (scripts/serve.sh), as Railway does.
      - run: pnpm test:e2e
      - run: pnpm test:lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-reports
          path: |
            test-results/
            .lighthouseci/
          retention-days: 7
